<!DOCTYPE html>
<html lang="en">

<head>
    <title>syncryn1z3</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="main.css">
    <script src="main.js"></script>
</head>

<body>
    <header>
        <h1>syncryn1z3</h1>
        <h2>mostly compliant with IEEE 1588</h2>
    </header>

    <div class="notification-container">
        <div id="notificationBar">Status</div>
    </div>

    <div class="main-container">
        <div class="input-box" id="create-box">
            <h2>Create Clock</h2>
            <span class="input-span">
                <input type="text" id="createClockId" placeholder="Clock ID" maxlength="16">
                <input type="text" id="createPort" placeholder="Port" maxlength="4">
            </span>
            <input type="text" id="createUserDescription" placeholder="User description" maxlength="128">
            <input type="password" id="createSecret" placeholder="Secret" maxlength="100">
            <button onclick="createClock()">create</button>
        </div>

        <div class="input-box" id="inspect-box">
            <h2>Inspect Clock</h2>
            <span class="input-span">
                <input type="text" id="inspectClockId" placeholder="Clock ID" maxlength="16">
                <input type="text" id="inspectPort" placeholder="Port" maxlength="4">
            </span>
            <input type="password" id="inspectSecret" placeholder="Secret" maxlength="100">
            <button onclick="inspectClock()">Inspect</button>

            <hr>

            <div class="inspect-results">
                <span id="inspectPlaceholder">Authenticate to inspect port</span>
                <div id="inspectList" style="display: none;"></div>
            </div>
        </div>

        <div class="clock-results">
            <table>
                <thead>
                    <tr>
                        <th>Clock ID</th>
                        <th>Port</th>
                    </tr>
                </thead>
                <tbody id="clockTable"></tbody>
            </table>
        </div>
    </div>
</body>

</html>
